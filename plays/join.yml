---
- name: Get tokens from main controller plane
  hosts: node1
  become: true
  tasks:
    - name: Make a join command
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: worker_join_cmd

    - name: Make a cert-key for other controllers
      ansible.builtin.shell: kubeadm init phase upload-certs --upload-certs | tail -n 1
      register: cert_key

    - name: Share information with other nodes
      ansible.builtin.set_fact:
        worker_join: "{{ worker_join_cmd.stdout }}"
        control_join: "{{ worker_join_cmd.stdout }} --control-plane --certificate-key {{ cert_key.stdout }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"

- name: Join extra stacked nodes as control-plane
  hosts: "node*"
  become: true
  tasks:
    - name: Check if k8s exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_check

    - name: Join as controller
      ansible.builtin.shell: "{{ hostvars['node1']['control_join'] }}"
      when:
        - inventory_hostname != 'node1'
        - not k8s_check.stat.exists

- name: Allow scheduling on all stacked nodes
  hosts: node1
  become: true
  tasks:
    - name: Remove control-plane taint from all nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - taint
          - nodes
          - --all
          - node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: untaint_result
      retries: 10
      delay: 6
      changed_when: "'untainted' in untaint_result.stdout"
      failed_when: untaint_result.rc != 0 and 'not found' not in untaint_result.stderr
      until: untaint_result.rc == 0 or 'not found' in untaint_result.stderr

    - name: Verify control-plane taint is gone
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - jsonpath={range .items[*]}{.metadata.name}{" "}{.spec.taints}{"\n"}{end}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: taint_state
      changed_when: false

    - name: Assert no node has control-plane taint
      ansible.builtin.assert:
        that:
          - "'node-role.kubernetes.io/control-plane' not in taint_state.stdout"
        fail_msg: "Control-plane taint still present on one or more nodes: {{ taint_state.stdout }}"
        success_msg: "All nodes are schedulable for stacked setup."
