---
- name: Deploy Velero Backup System
  hosts: master
  tasks:
    - name: Copy Velero manifest files
      copy:
        src: "{{ item }}"
        dest: "/home/ubuntu/{{ item }}"
      with_items:
        - minio-setup.yaml
        - credentials-velero

    - name: Apply MinIO Deployment
      kubernetes.core.k8s:
        state: present
        src: /home/ubuntu/minio-setup.yaml

    - name: Install Velero via Shell
      shell: |
        velero install \
          --provider aws \
          --plugins velero/velero-plugin-for-aws:v1.9.0 \
          --bucket velero \
          --secret-file /home/ubuntu/credentials-velero \
          --use-node-agent \
          --use-volume-snapshots=false \
          --namespace velero \
          --backup-location-config region=minio,s3ForcePathStyle="true",s3Url=http://minio.velero.svc:9000
      register: velero_out
      failed_when: "'already exists' not in velero_out.stderr and velero_out.rc != 0"

    - name: Show status
      debug:
        msg: "Velero setup complete. Run 'velero backup-location get' to verify."
