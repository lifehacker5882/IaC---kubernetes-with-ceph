apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    allowUnsupported: true
    image: quay.io/ceph/ceph:v19.2.1
  dataDirHostPath: /var/lib/rook
  dashboard:
    enabled: true
  mgr:
    count: 1
  mon:
    count: 3
    allowMultiplePerNode: false
  network:
    hostNetwork: true
  storage:
    useAllNodes: true
    useAllDevices: true
    #