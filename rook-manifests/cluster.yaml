apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    allowUnsupported: true
    image: quay.io/ceph/ceph:v19.2.1
  dataDirHostPath: /var/lib/rook
  dashboard:
    enabled: true
  mgr:
    count: 1
  mon:
    count: 3
    allowMultiplePerNode: false
  network:
    hostNetwork: true
    # hostNetwork er satt til true for å unngå MTU- og rutingproblemer i Calico/pod-nettverket.
    # Dette lar Ceph-monitorene binde seg direkte til nodenes fysiske IP-adresser (10.196.x.x).
    # Ved re-installasjon må /var/lib/rook slettes på alle noder for å unngå IP-konflikter.
  storage:
    useAllNodes: true
    useAllDevices: true
    #