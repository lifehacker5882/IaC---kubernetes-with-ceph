---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    app.kubernetes.io/name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
  labels:
    app.kubernetes.io/name: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-api
  namespace: media
  labels:
    app.kubernetes.io/name: media-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir flask prometheus-client && \
              python - <<'PY'
              from flask import Flask
              from prometheus_client import Counter, generate_latest, CONTENT_TYPE_LATEST

              app = Flask(__name__)
              requests = Counter('media_api_requests_total', 'Total requests')

              @app.route('/')
              def index():
                  requests.inc()
                  return 'media api ok\n'

              @app.route('/metrics')
              def metrics():
                  return generate_latest(), 200, {'Content-Type': CONTENT_TYPE_LATEST}

              app.run(host='0.0.0.0', port=9090)
              PY
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: media-data
              mountPath: /data/media
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: media-api
  namespace: media
  labels:
    app.kubernetes.io/name: media-api
spec:
  selector:
    app.kubernetes.io/name: media-api
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: media-api
  namespace: rook-ceph
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      app.kubernetes.io/name: media-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
