# Values for rook-release/rook-ceph-cluster in the main (non-kubespray) flow
operatorNamespace: rook-ceph

cephClusterSpec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false

  dataDirHostPath: /var/lib/rook

  mon:
    count: 3
    allowMultiplePerNode: false

  dashboard:
    enabled: true

  monitoring:
    enabled: true
    externalPrometheusMgr: true

  network:
    provider: host     # Dette er den magiske linjen
    addressRanges:     # Valgfritt, men anbefalt for ryddighet
      public: ["10.196.0.0/16"]  # Subnettet dine noder bor på
      cluster: ["10.196.0.0/16"]

  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: node1
        devices:
          - name: sdb
          - name: sdc
      - name: node2
        devices:
          - name: sdb
          - name: sdc
      - name: node3
        devices:
          - name: sdb
          - name: sdc

  dashboard:
    enabled: false  # Dette frigjør portene 8443 og 9283 som feilet i loggen din

  resources:
    mgr:
      limits:
        memory: "1Gi"      # Økt fra 512Mi for å unngå OOMKilled
      requests:
        cpu: "100m"
        memory: "256Mi"
    mon:
      limits:
        memory: "2Gi"
      requests:
        cpu: "100m"
        memory: "512Mi"
    osd:
      limits:
        memory: "4Gi"      # OSD-er trenger mye RAM under tunge løft
      requests:
        cpu: "100m"
        memory: "512Mi"
    # Dette sikrer at Ceph-klienten også får plass
    prepareosd:
      requests:
        cpu: "50m"
        memory: "50Mi"

cephBlockPools:
  - name: replicapool
    spec:
      failureDomain: host
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: rook-ceph-block
      provisioner: rook-ceph.rbd.csi.ceph.com
      isDefault: false
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        clusterID: rook-ceph
        pool: replicapool
        imageFormat: "2"
        imageFeatures: layering

        csi.storage.k8s.io/fstype: ext4
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph

cephFileSystems: []
cephObjectStores: []
